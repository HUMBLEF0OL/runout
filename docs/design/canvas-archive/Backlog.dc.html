<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runout backlog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5C46B}a:hover{color:#FFDCA0}
button,a{transition:transform 100ms cubic-bezier(0.16,1,0.3,1),filter 150ms,background 150ms,box-shadow 150ms}
button{cursor:pointer}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(0.98)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #F5B544;outline-offset:2px}
input:focus,textarea:focus,select:focus{border-color:#F5B544 !important;box-shadow:0 0 0 3px rgba(245,181,68,0.18)}
[style*="padding: 8px 10px; border-radius: 10px"]{transition:background 150ms}
[style*="padding: 8px 10px; border-radius: 10px"]:hover{background:#1F2226}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</helmet>
<div style="min-height: 1000px; width: 100%; box-sizing: border-box; background: #101113; color: #ECEDEF; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 14px; display: flex; flex-wrap: wrap; align-items: stretch">

  <nav aria-label="Main" style="flex: 1 1 208px; max-width: 220px; box-sizing: border-box; padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; background: #0B0C0E; border-right: 1px solid #23262B">
    <span style="padding: 0 10px; font-weight: 800; font-size: 19px; letter-spacing: -0.02em">Runout</span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <a href="#" style="{{n.style}}"><span>{{n.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9A9FA8">{{n.count}}</span></a>
      </sc-for>
    </div>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 20px 32px 40px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <form style="flex: 1 1 380px; display: flex; gap: 8px; min-width: 0">
        <label for="bl-add" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search your library or paste a Spotify link</label>
        <input id="bl-add" type="text" placeholder="Search your library, or paste a Spotify link to add it" style="flex: 1 1 auto; min-width: 0; height: 42px; box-sizing: border-box; padding: 0 16px; border: 1px solid #2E3238; border-radius: 10px; background: #17191C; color: #ECEDEF; font: inherit">
        <button type="button" style="height: 42px; padding: 0 18px; border: 0; border-radius: 10px; background: linear-gradient(180deg, #F8C566, #F0A92E); color: #101113; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 8px rgba(245,181,68,0.18); font: inherit; font-weight: 700">Add</button>
      </form>
    </header>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Backlog</h1>
        <span style="color: #A9AEB7">37 waiting · oldest added 5 months ago</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <div role="group" aria-label="Type" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #17191C">
          <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
            <button type="button" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
        <label for="bl-tag" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Tag</label>
        <select id="bl-tag" style="height: 40px; padding: 0 10px; border: 1px solid #3A3F46; border-radius: 10px; background: #17191C; color: #ECEDEF; font: inherit">
          <option>All tags</option><option>jazz</option><option>late-night</option>
        </select>
        <label for="bl-sort" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Sort</label>
        <select id="bl-sort" style="height: 40px; padding: 0 10px; border: 1px solid #3A3F46; border-radius: 10px; background: #17191C; color: #ECEDEF; font: inherit">
          <option>My order</option><option>Priority</option><option>Date added</option>
        </select>
      </div>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 4px">
        <h2 style="margin: 0 0 6px; font-size: 13px; font-weight: 700; color: {{g.color}}">{{g.name}}</h2>
        <div style="border-radius: 16px; background: linear-gradient(180deg, #1A1C20, #16181B); border: 1px solid rgba(255,255,255,0.06); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.28); padding: 6px; display: flex; flex-direction: column">
          <sc-for list="{{g.items}}" as="r" hint-placeholder-count="3">
            <div style="{{r.rowStyle}}">
              <input type="checkbox" aria-label="Select {{r.title}}" checked="{{r.sel}}" style="width: 16px; height: 16px">
              <div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 6px; background: {{r.tint}}"></div>
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
                <span style="font-size: 12px; color: #A9AEB7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.artist}}</span>
              </div>
              <span style="font-size: 13px; color: #C3C7CE">{{r.type}}</span>
              <span style="font-size: 13px; color: #C3C7CE">{{r.from}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9A9FA8">{{r.age}}</span>
              <button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #3A3F46; border-radius: 10px; background: transparent; color: #ECEDEF; font: inherit; font-size: 13px; white-space: nowrap">Start</button>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <div role="region" aria-label="Selection actions" style="position: sticky; bottom: 16px; align-self: center; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 16px; background: #ECEDEF; color: #101113; box-shadow: 0 12px 32px rgba(0,0,0,0.45)">
      <span style="font-weight: 700; padding: 0 6px">2 selected</span>
      <button type="button" style="height: 34px; padding: 0 12px; border: 0; border-radius: 10px; background: #101113; color: #ECEDEF; font: inherit; font-weight: 600">Set priority</button>
      <button type="button" style="height: 34px; padding: 0 12px; border: 0; border-radius: 10px; background: #101113; color: #ECEDEF; font: inherit; font-weight: 600">Add tag</button>
      <button type="button" style="height: 34px; padding: 0 12px; border: 0; border-radius: 10px; background: #101113; color: #ECEDEF; font: inherit; font-weight: 600">Remove from backlog</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const navBase = 'display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #C3C7CE;';
    const nav = [['Home', ''], ['Backlog', '37'], ['Library', '214'], ['Rediscover', '6'], ['Settings', '']]
      .map(([label, count]) => ({ label, count, style: navBase + (label === 'Backlog' ? ' background: #1F2226; color: #ECEDEF; font-weight: 700; box-shadow: inset 3px 0 0 #F5B544;' : '') }));
    const tBase = 'height: 34px; padding: 0 12px; border: 0; border-radius: 8px; font: inherit; font-size: 13px;';
    const types = ['All', 'Albums', 'Tracks', 'Artists'].map(label => ({ label, style: tBase + (label === 'All' ? ' background: #ECEDEF; color: #101113; font-weight: 700;' : ' background: transparent; color: #C3C7CE;') }));
    const row = (sel) => 'display: grid; grid-template-columns: 16px 40px minmax(0, 1fr) 64px 110px 72px auto; gap: 14px; align-items: center; padding: 8px 10px; border-radius: 10px;' + (sel ? ' background: #1F2226;' : '');
    const mk = (items) => items.map(r => ({ ...r, rowStyle: row(r.sel), sel: !!r.sel }));
    const groups = [
      { name: 'High priority', color: '#F5B544', items: mk([
        { title: 'Madvillainy', artist: 'Madvillain', type: 'Album', from: 'Ishaan', age: '2 days', tint: '#8A6A2E', sel: true },
        { title: 'Alice Coltrane', artist: 'Start with Journey in Satchidananda', type: 'Artist', from: 'You', age: '3 days', tint: '#3D5A4A', sel: true }
      ]) },
      { name: 'Medium', color: '#C3C7CE', items: mk([
        { title: 'Blue Lines', artist: 'Massive Attack', type: 'Album', from: 'Meera', age: '3 weeks', tint: '#2B4F7A' },
        { title: 'cold/mess', artist: 'Prateek Kuhad', type: 'Track', from: 'Phone', age: '4 days', tint: '#4F5B6B' },
        { title: 'Thembi', artist: 'Pharoah Sanders', type: 'Album', from: 'Ishaan', age: 'today', tint: '#5C4630' }
      ]) },
      { name: 'No priority', color: '#C3C7CE', items: mk([
        { title: 'Sound of Silver', artist: 'LCD Soundsystem', type: 'Album', from: 'You', age: '2 months', tint: '#585858' },
        { title: 'Carrie & Lowell', artist: 'Sufjan Stevens', type: 'Album', from: 'You', age: '5 months', tint: '#5E6F63' },
        { title: 'Teardrop', artist: 'Massive Attack', type: 'Track', from: 'Phone', age: '6 days', tint: '#2B4F7A' }
      ]) }
    ];
    return { nav, types, groups };
  }
}
</script>
</body>
</html>
