<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runout library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5C46B}a:hover{color:#FFDCA0}
button,a{transition:transform 100ms cubic-bezier(0.16,1,0.3,1),filter 150ms,background 150ms,box-shadow 150ms}
button{cursor:pointer}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(0.98)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #F5B544;outline-offset:2px}
input:focus,textarea:focus,select:focus{border-color:#F5B544 !important;box-shadow:0 0 0 3px rgba(245,181,68,0.18)}
a > div[aria-hidden="true"]{transition:transform 150ms cubic-bezier(0.16,1,0.3,1),box-shadow 150ms}
a:hover > div[aria-hidden="true"]{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,0.4)}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</helmet>
<div style="min-height: 1000px; width: 100%; box-sizing: border-box; background: #101113; color: #ECEDEF; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 14px; display: flex; flex-wrap: wrap; align-items: stretch">

  <nav aria-label="Main" style="flex: 1 1 208px; max-width: 220px; box-sizing: border-box; padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; background: #0B0C0E; border-right: 1px solid #23262B">
    <span style="padding: 0 10px; font-weight: 800; font-size: 19px; letter-spacing: -0.02em">Runout</span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <a href="#" style="{{n.style}}"><span>{{n.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9A9FA8">{{n.count}}</span></a>
      </sc-for>
    </div>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 20px 32px 40px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <form style="flex: 1 1 380px; display: flex; gap: 8px; min-width: 0">
        <label for="lb-add" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search your library or paste a Spotify link</label>
        <input id="lb-add" type="text" placeholder="Search your library, or paste a Spotify link to add it" style="flex: 1 1 auto; min-width: 0; height: 42px; box-sizing: border-box; padding: 0 16px; border: 1px solid #2E3238; border-radius: 10px; background: #17191C; color: #ECEDEF; font: inherit">
        <button type="button" style="height: 42px; padding: 0 18px; border: 0; border-radius: 10px; background: linear-gradient(180deg, #F8C566, #F0A92E); color: #101113; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 8px rgba(245,181,68,0.18); font: inherit; font-weight: 700">Add</button>
      </form>
    </header>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Library</h1>
        <div role="tablist" aria-label="Type" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #17191C">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
            <button type="button" role="tab" aria-selected="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <label for="lb-status" style="font-size: 13px; color: #C3C7CE">Status</label>
        <select id="lb-status" style="height: 40px; padding: 0 10px; border: 1px solid #3A3F46; border-radius: 10px; background: #17191C; color: #ECEDEF; font: inherit"><option>Any</option><option>Explored</option></select>
        <label for="lb-rating" style="font-size: 13px; color: #C3C7CE">Rating</label>
        <select id="lb-rating" style="height: 40px; padding: 0 10px; border: 1px solid #3A3F46; border-radius: 10px; background: #17191C; color: #ECEDEF; font: inherit"><option>4 and up</option><option>Any</option></select>
        <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #3A3F46; border-radius: 10px; background: transparent; color: #ECEDEF; font: inherit">Save as filter</button>
      </div>
    </div>

    <span style="font-size: 13px; color: #A9AEB7">10 albums rated 4 and up, or still open. Sorted by last change.</span>

    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px">
      <sc-for list="{{albums}}" as="a" hint-placeholder-count="10">
        <a href="#" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #ECEDEF">
          <div aria-hidden="true" style="aspect-ratio: 1 / 1; border-radius: 10px; background: {{a.tint}}"></div>
          <span style="font-weight: 600; font-size: 14px; line-height: 1.25">{{a.title}}</span>
          <span style="font-size: 12px; color: #A9AEB7">{{a.artist}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{a.color}}">{{a.state}}</span>
        </a>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <a href="#" style="font-size: 13px; font-weight: 600">Open Spotify</a>
      <div style="display: flex; gap: 8px; align-items: center">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9A9FA8">1 to 10 of 10</span>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const navBase = 'display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #C3C7CE;';
    const nav = [['Home', ''], ['Backlog', '37'], ['Library', '214'], ['Rediscover', '6'], ['Settings', '']]
      .map(([label, count]) => ({ label, count, style: navBase + (label === 'Library' ? ' background: #1F2226; color: #ECEDEF; font-weight: 700; box-shadow: inset 3px 0 0 #F5B544;' : '') }));
    const tBase = 'height: 34px; padding: 0 14px; border: 0; border-radius: 8px; font: inherit; font-size: 13px;';
    const tabs = [['Albums 98', true], ['Tracks 81', false], ['Artists 35', false]]
      .map(([label, on]) => ({ label, on: on ? 'true' : 'false', style: tBase + (on ? ' background: #ECEDEF; color: #101113; font-weight: 700;' : ' background: transparent; color: #C3C7CE;') }));
    const albums = [
      ['Journey in Satchidananda', 'Alice Coltrane', 'Explored ★4.5', '#3D5A4A'],
      ['A Love Supreme', 'John Coltrane', 'Explored ★5', '#3B3B44'],
      ['Ptah, the El Daoud', 'Alice Coltrane', 'Planned', '#4A5A3B', true],
      ['Promises', 'Floating Points', 'In progress', '#2E3F5C', true],
      ['Kind of Blue', 'Miles Davis', 'Explored ★5', '#2B4F7A'],
      ['Hounds of Love', 'Kate Bush', 'Revisit ★5', '#6B3A4A', true],
      ['Mezzanine', 'Massive Attack', 'Explored ★4.5', '#33333A'],
      ['Moon Safari', 'Air', 'Explored ★4', '#4A5A6B'],
      ['Carrie & Lowell', 'Sufjan Stevens', 'Explored ★4.5', '#5E6F63'],
      ['Bitches Brew', 'Miles Davis', 'Abandoned', '#5C4630']
    ].map(([title, artist, state, tint, hot]) => ({ title, artist, state, tint, color: hot ? '#F5B544' : '#A9AEB7' }));
    return { nav, tabs, albums };
  }
}
</script>
</body>
</html>
