[package]
name = "runout"
version = "0.1.0"
description = "Runout — local-first music notebook for Spotify"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "runout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
chrono = "0.4.45"
sha2 = "0.11.1"
rand = "0.10.3"
tiny_http = "0.12.0"
tauri-plugin-dialog = "2.8.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
# tauri::test mock runtime: commands.rs round-trips invokes with the keys src/api.ts sends.
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
# Credential Manager delete for --uninstall-cleanup (TSD §4.11); M4 adds Media_Control (SMTC).
windows = { version = "0.62.2", features = ["Win32_Security_Credentials"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
